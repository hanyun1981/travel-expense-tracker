<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>旅遊記帳 · Travel Split</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Loading overlay -->
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <p>載入中...</p>
    </div>

    <!-- Login screen -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-card">
        <div class="login-logo">✈️</div>
        <h1 class="login-title">旅遊記帳</h1>
        <p class="login-subtitle">記錄每一次出遊的開銷，輕鬆算清誰付誰</p>
        <button id="google-signin-btn" class="google-btn">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          使用 Google 帳號登入
        </button>
        <p id="login-error" class="login-error hidden"></p>
        <p class="login-footer">登入即表示同意將你的旅程資料儲存於 Firebase</p>
      </div>
    </div>

    <!-- Header -->
    <header class="app-header hidden" id="app-header">
      <div class="header-inner">
        <button id="back-btn" class="icon-btn hidden" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="page-title">旅遊記帳</h1>
        <button id="header-action" class="icon-btn hidden" aria-label="動作">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
        <button id="user-menu-btn" class="user-avatar-btn" aria-label="使用者選單">
          <img id="user-avatar-img" src="" alt="" />
        </button>
      </div>
    </header>

    <!-- Main views -->
    <main id="main-content">
      <!-- Trip list view -->
      <section id="trips-view" class="view">
        <div class="hero">
          <h2>你的旅程</h2>
          <p class="subtitle">記錄每一次出遊的開銷，輕鬆算清誰付誰</p>
        </div>
        <div id="trips-list" class="trips-grid"></div>
        <div id="trips-empty" class="empty-state hidden">
          <div class="empty-icon">✈️</div>
          <h3>還沒有旅程</h3>
          <p>建立第一個旅程，開始記帳吧</p>
        </div>
      </section>

      <!-- Trip detail view -->
      <section id="trip-detail-view" class="view hidden">
        <div class="trip-header">
          <div class="trip-header-info">
            <h2 id="trip-name"></h2>
            <p id="trip-meta" class="trip-meta"></p>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="expenses">支出</button>
          <button class="tab-btn" data-tab="settle">結算</button>
          <button class="tab-btn" data-tab="members">成員</button>
        </div>

        <div id="tab-expenses" class="tab-content">
          <div class="summary-card">
            <div class="summary-item">
              <span class="summary-label">總支出</span>
              <span id="total-expense" class="summary-value">--</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">筆數</span>
              <span id="expense-count" class="summary-value">0</span>
            </div>
          </div>
          <div id="expenses-list" class="expenses-list"></div>
          <div id="expenses-empty" class="empty-state hidden">
            <div class="empty-icon">💸</div>
            <h3>還沒有支出</h3>
            <p>點右下角按鈕新增第一筆</p>
          </div>
        </div>

        <div id="tab-settle" class="tab-content hidden">
          <div class="settle-summary" id="settle-summary"></div>
          <div class="balance-list" id="balance-list"></div>
          <div class="settle-divider">
            <span>結算建議</span>
          </div>
          <div class="settlements-list" id="settlements-list"></div>
        </div>

        <div id="tab-members" class="tab-content hidden">
          <div id="members-list" class="members-list"></div>
          <button id="add-member-btn" class="btn btn-secondary full-width">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增成員
          </button>
        </div>
      </section>
    </main>

    <!-- Floating Action Button -->
    <button id="fab" class="fab hidden" aria-label="新增">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Modal: Trip create/edit -->
    <div id="trip-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="trip-modal-title">新增旅程</h3>
          <button class="icon-btn close-modal" aria-label="關閉">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="trip-form" class="modal-body">
          <div class="form-group">
            <label>旅程名稱</label>
            <input type="text" id="trip-name-input" required placeholder="例如：日本九州之旅" />
          </div>
          <div class="form-group">
            <label>主要幣別</label>
            <select id="trip-currency-input" required>
              <option value="TWD">TWD 新台幣</option>
              <option value="JPY">JPY 日圓</option>
              <option value="USD">USD 美元</option>
              <option value="EUR">EUR 歐元</option>
              <option value="KRW">KRW 韓元</option>
              <option value="CNY">CNY 人民幣</option>
              <option value="HKD">HKD 港幣</option>
              <option value="THB">THB 泰銖</option>
              <option value="GBP">GBP 英鎊</option>
              <option value="SGD">SGD 新加坡幣</option>
              <option value="MYR">MYR 馬來西亞令吉</option>
              <option value="VND">VND 越南盾</option>
              <option value="AUD">AUD 澳幣</option>
              <option value="CAD">CAD 加幣</option>
            </select>
            <p class="form-hint">所有支出將以此幣別顯示總額與結算</p>
          </div>
          <div class="form-group">
            <label>初始成員（每行一位）</label>
            <textarea id="trip-members-input" rows="4" placeholder="小美&#10;阿明&#10;Tony"></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-text close-modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Expense create/edit -->
    <div id="expense-modal" class="modal hidden">
      <div class="modal-content modal-large">
        <div class="modal-header">
          <h3 id="expense-modal-title">新增支出</h3>
          <button class="icon-btn close-modal" aria-label="關閉">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="expense-form" class="modal-body">
          <div class="form-group">
            <label>項目名稱</label>
            <input type="text" id="exp-title" required placeholder="例如：晚餐、計程車、住宿" />
          </div>

          <div class="form-row">
            <div class="form-group flex-2">
              <label>金額</label>
              <input type="number" id="exp-amount" required step="0.01" min="0" placeholder="0" />
            </div>
            <div class="form-group flex-1">
              <label>幣別</label>
              <select id="exp-currency" required></select>
            </div>
          </div>

          <div id="rate-display" class="rate-display hidden"></div>

          <div class="form-group">
            <label>類別</label>
            <div class="category-grid">
              <button type="button" class="cat-btn active" data-cat="general">📝 一般</button>
              <button type="button" class="cat-btn" data-cat="food">🍴 餐飲</button>
              <button type="button" class="cat-btn" data-cat="transport">🚕 交通</button>
              <button type="button" class="cat-btn" data-cat="lodging">🏨 住宿</button>
              <button type="button" class="cat-btn" data-cat="ticket">🎫 門票</button>
              <button type="button" class="cat-btn" data-cat="shopping">🛍️ 購物</button>
            </div>
          </div>

          <div class="form-group">
            <label>日期</label>
            <input type="date" id="exp-date" required />
          </div>

          <div class="form-group">
            <label>付款人</label>
            <div id="payer-chips" class="chips-row"></div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label>分攤方式</label>
              <div class="split-mode-toggle">
                <button type="button" class="split-mode active" data-mode="equal">均分</button>
                <button type="button" class="split-mode" data-mode="amount">指定金額</button>
                <button type="button" class="split-mode" data-mode="percent">指定比例</button>
                <button type="button" class="split-mode" data-mode="share">份數</button>
              </div>
            </div>
            <div id="split-list" class="split-list"></div>
            <div id="split-summary" class="split-summary"></div>
          </div>

          <div class="form-group">
            <label>備註（可選）</label>
            <textarea id="exp-note" rows="2" placeholder="補充說明..."></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" id="delete-expense-btn" class="btn btn-danger hidden">刪除</button>
            <button type="button" class="btn btn-text close-modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Member edit -->
    <div id="member-modal" class="modal hidden">
      <div class="modal-content modal-small">
        <div class="modal-header">
          <h3 id="member-modal-title">新增成員</h3>
          <button class="icon-btn close-modal" aria-label="關閉">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="member-form" class="modal-body">
          <div class="form-group">
            <label>名稱</label>
            <input type="text" id="member-name-input" required placeholder="成員名稱" />
          </div>
          <div class="modal-footer">
            <button type="button" id="delete-member-btn" class="btn btn-danger hidden">移除</button>
            <button type="button" class="btn btn-text close-modal">取消</button>
            <button type="submit" class="btn btn-primary">儲存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Action sheet -->
    <div id="action-sheet" class="modal hidden">
      <div class="action-sheet-content">
        <button id="action-edit-trip" class="action-item">編輯旅程</button>
        <button id="action-rates" class="action-item">設定匯率</button>
        <button id="action-export" class="action-item">匯出資料</button>
        <button id="action-delete-trip" class="action-item danger">刪除旅程</button>
        <button class="action-item cancel close-modal">取消</button>
      </div>
    </div>

    <!-- Modal: User menu -->
    <div id="user-menu" class="modal hidden">
      <div class="action-sheet-content">
        <div class="user-info">
          <img id="user-info-avatar" src="" alt="" />
          <div>
            <div id="user-info-name" class="user-info-name"></div>
            <div id="user-info-email" class="user-info-email"></div>
          </div>
        </div>
        <button id="action-logout" class="action-item danger">登出</button>
        <button class="action-item cancel close-modal">取消</button>
      </div>
    </div>

    <!-- Modal: Currency rates -->
    <div id="rates-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>匯率設定</h3>
          <button class="icon-btn close-modal" aria-label="關閉">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="form-hint">設定 1 單位外幣 = 多少主要幣別。可點「自動取得」由網路抓取最新匯率。</p>
          <div id="rates-base"></div>
          <button type="button" id="fetch-rates-btn" class="btn btn-secondary full-width">自動取得匯率</button>
          <div id="rates-list" class="rates-list"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-text close-modal">關閉</button>
            <button type="button" id="save-rates-btn" class="btn btn-primary">儲存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Firebase compat SDK (works with file:// double-click) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
